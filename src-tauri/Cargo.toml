[package]
name = "irannanternet"
version = "0.1.0"
description = "Regional-aware uptime and server health monitoring"
authors = ["IranNANternet contributors"]
license = "MIT"
repository = "https://github.com/drstreet/nanternet"
edition = "2021"

[lib]
name = "irannanternet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-notification = "2.3"
tauri-plugin-opener = "2.5"
tauri-plugin-autostart = "2.5"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider", "charset", "http2", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.25", features = ["v4", "serde"] }
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
keyring = "4.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0"
x509-parser = "0.18"
time = { version = "0.3", default-features = false, features = ["std", "parsing", "macros"] }

[features]
default = []

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
